[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikitrace"
version = "0.2.0"
description = "Knowledge quality tracing for LLM features. Drop a PDF, ask a question, see every citation traced."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Omkar Ray" }
]
keywords = ["llm", "rag", "observability", "tracing", "evaluation", "langchain", "llamaindex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core SDK is stdlib-only.
dependencies = []

[project.optional-dependencies]
# Framework adapters — only pull in heavy deps when the user opts in.
langchain = [
    "langchain-core>=0.3.0",
]
crewai = [
    "crewai>=0.70.0",
]
adk = [
    "google-adk>=0.1.0",
]
agno = [
    "agno>=0.1.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
cloud = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
]
dev = [
    # Test framework + async + HTTP client for FastAPI in-process tests
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    # Postgres driver — needed for the Postgres test path. Skipped at
    # import-time if not installed; the cloud package does the same.
    "asyncpg>=0.29.0",
    # OpenTelemetry exporter (in-memory) for hook-fan-out tests
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
all = [
    "langchain-core>=0.3.0",
    "crewai>=0.70.0",
    "google-adk>=0.1.0",
    "agno>=0.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires DATABASE_URL pointing at a Postgres instance",
    "integration: hits a real external API; requires the corresponding key in the env",
]
filterwarnings = [
    # FastAPI's deprecated on_event used in the cloud server; suppress
    # the warning so the test suite stays clean.
    "ignore::DeprecationWarning:fastapi.applications",
]

[project.urls]
Homepage = "https://github.com/OmkarRayAI/wiki-trace"
Repository = "https://github.com/OmkarRayAI/wiki-trace"
Documentation = "https://github.com/OmkarRayAI/wiki-trace#readme"
Issues = "https://github.com/OmkarRayAI/wiki-trace/issues"

[project.scripts]
wikitrace = "wikitrace.__main__:main"

[tool.setuptools]
packages = [
    "wikitrace",
    "wikitrace.integrations",
    "wikitrace.integrations.langchain",
    "wikitrace.integrations.crewai",
    "wikitrace.integrations.adk",
    "wikitrace.integrations.agno",
    "wikitrace.integrations.openai",
    "wikitrace.integrations.anthropic",
    "wikitrace.integrations.otel",
    "wikitrace.langchain",
    "wikitrace.crewai",
    "wikitrace.adk",
    "wikitrace.agno",
    "wikitrace.openai",
    "wikitrace.anthropic",
    "wikitrace.otel",
    "wikitrace.cloud",
]

[tool.setuptools.package-data]
wikitrace = ["py.typed"]
